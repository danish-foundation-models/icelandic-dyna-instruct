[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reverse-instruct"
version = "0.1.0"
description = "Generate Faroese and Icelandic instruction data from DynaWord passages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=4.0.0",
  "huggingface-hub>=0.34.0",
  "openai>=1.100.0",
  "pyarrow>=20.0.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[project.scripts]
reverse-instruct = "reverse_instruct.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_instruct"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
